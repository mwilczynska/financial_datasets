name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    name: Validation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Run validation suite
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q tests/validation tests/automation

  incremental-catchup:
    if: github.event_name == 'pull_request'
    name: Clean Linux incremental catch-up
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Update and validate from committed baseline
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        shell: bash
        run: |
          TARGET_DATE=$(TZ=America/New_York date -d yesterday +%F)
          python src/update_all_datasets.py --end-date "$TARGET_DATE"
          python scripts/check_daily_diff.py --end-date "$TARGET_DATE"
