asset_id: gold
asset_name: Gold (GLD price and total return, modeled history to 1970)
backtest_alias: GOLDPM
tracks_etf: GLD
minimum_start_date: 1970-01-01
target_frequency: daily
output_contract: yahoo_compatible_ohlcv_plus_returns
status: production_built
definition_note: >
  Before 2004-11-18, Close is preserved LBMA PM USD/oz and Adj Close models
  spot less 0.40% annual GLD expenses. From the earliest GLD quote (2004-11-18),
  both columns are scaled Yahoo GLD indices. Modern Close is not USD/oz.
splice:
  last_model_date: 2004-11-17
  first_observed_gld_date: 2004-11-18
  method: separate constant scales anchored to preceding modeled levels
  first_gld_return: zero; initial ETF quote anchors both indices
calendar_note: Preserved LBMA calendar before GLD; observed NYSE calendar from 2004-11-18.
gold2x_dependency: sources/derived/gold_2x_historical_spot_returns.csv preserves original spot inputs through UGL inception.
sources:
  - name: Published pre-GLD model
    role: preserved_historical_model
    status: historical_only
    path: data/processed/gold.csv
    original_url: https://prices.lbma.org.uk/json/gold_pm.json
    coverage: 1970-01-02 through 2004-11-17
  - name: Yahoo Finance chart API GLD
    role: observed_price_and_adjusted_return_source
    status: active_from_2004_11_18
    url: https://query1.finance.yahoo.com/v8/finance/chart/GLD
    notes: GLD expenses are embedded; no extra fee deduction.
  - name: GLD expense ratio (0.40%)
    role: pre_inception_model_parameter
    status: reference
    url: https://www.ssga.com/us/en/individual/etfs/spdr-gold-shares-gld
validation:
  coverage_anchor_date: 1970-01-01
  required_checks:
    - yahoo_schema
    - minimum_coverage
    - sorted_unique_dates
    - positive_levels
    - price_and_total_return_arithmetic
    - model_expense_drag
    - both_observed_indices_proportional_to_gld
    - earliest_quote_2004_11_18
    - continuous_splice_with_zero_first_gld_return
    - csv_parquet_agreement
automated_publication:
  mode: incremental_from_committed_processed_csv
  historical_raw_required: false
  current_source: Yahoo GLD only
  recent_source_validation: scripts/check_daily_diff.py
  overlap_calendar_days: 14
data_rights_note: Yahoo access and redistribution terms remain unresolved.
