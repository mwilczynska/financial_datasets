asset_id: cpi_inflation
asset_name: U.S. CPI-U Inflation Index
alias: CPI
minimum_start_date: 1970-01-01
target_frequency: calendar_daily
output_contract: yahoo_compatible_ohlcv_plus_returns
status: complete_model_derived_from_monthly_cpi
sources:
  - name: BLS CPI-U All Urban Consumers, U.S. city average, all items, seasonally adjusted
    role: primary_monthly_cpi_source
    status: active
    series_id: CUSR0000SA0
    url: https://api.bls.gov/publicAPI/v2/timeseries/data/
    notes: Monthly CPI-U index, 1982-84=100. Daily rows are derived from these monthly observations.
  - name: FRED CPIAUCSL
    role: validation_reference_and_transient_outage_fallback
    status: active_fallback
    url: https://fred.stlouisfed.org/series/CPIAUCSL
    download_url: https://fred.stlouisfed.org/graph/fredgraph.csv
    notes: FRED republishes BLS seasonally adjusted CPI-U. Used only after BLS transport errors or transient HTTP failures. Requires the committed latest monthly anchor, at least three matching monthly observations, identical observed-month coverage in the committed overlap, consecutive new observations, and a latest observation within 90 days of the target. Preserve already documented unpublished months; reject any overlap disagreement.
method:
  close: CPI-U level, 1982-84=100
  adj_close: equal to Close
  returns: daily inflation rate from the CPI level
  daily_expansion: constant log interpolation between adjacent monthly observations; latest month carried forward until the next release
validation:
  required_checks:
    - yahoo_schema
    - calendar_daily_coverage
    - duplicate_dates
    - positive_levels
    - return_arithmetic
    - raw_bls_month_start_match
    - interpolation_flags_present

automated_publication:
  mode: incremental_from_committed_processed_csv
  historical_raw_required: false
  recent_source_validation: scripts/check_daily_diff.py
  revision_window: latest_monthly_observation_and_preceding_anchor
  source_provenance: provider_and_series_id_with_response_hash_and_retrieval_timestamp
