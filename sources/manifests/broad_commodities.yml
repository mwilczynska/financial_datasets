asset_id: broad_commodities
asset_name: Broad Commodities / DBC-like Total Return
backtest_alias: CMDTY
minimum_start_date: 1970-01-02
target_frequency: daily
output_contract: yahoo_compatible_ohlcv_plus_returns
status: complete_daily_gsci_er_tr_source_spliced_series
methodology_version: daily_gsci_er_tr_v1
redistribution_status: unresolved_vendor_and_derived_publication_rights
coverage_note: >
  Direct daily GSCI ER/TR on preserved CMDTY observation dates through 1991-01-02,
  followed by BCOM excess return plus project collateral and DBC ETF returns.
  GSCI history is provider back-calculated before its 1991-05-01 launch;
  source non-trading weekdays may carry previous levels.
target_definition: >
  Diversified commodity futures return proxy. Close uses GSCI/BCOM excess-return
  growth before DBC, then ETF price growth. Adj Close uses total-return growth.
  GSCI, BCOM and DBC weights and roll conventions differ.
update_policy:
  ordinary: incremental_recent_yahoo_dbc_only
  gsci_snapshot: pinned_commit_and_sha256
  gsci_calendar: sources/derived/broad_commodities_gsci_calendar.csv
  migration_option: --migrate-gsci
  migration_end_date: retain_existing_processed_end_date
  historical_full_rebuild: validated_bcom_and_irx_caches_plus_live_dbc
  historical_refresh_option: --refresh-historical-sources
  unavailable_historical_source: retain_valid_cache_or_fail_explicitly
  provenance: source_output_calendar_and_versioned_baseline_hashes
segments:
  - name: gsci_daily_er_tr
    first_date: 1970-01-02
    last_date: 1991-01-02
    rows: 5255
    quality_flag: backcalculated_gsci_daily_excess_and_total_return
    close_source: GSCI_ER
    adjusted_close_source: GSCI_TR
  - name: bcom_er_plus_project_collateral
    first_date: 1991-01-03
    last_date: 2006-02-06
    rows: 3781
    quality_flag: model_bcom_excess_return_plus_tbill_collateral
  - name: dbc_etf
    first_date: 2006-02-07
    last_date: live
    quality_flag: observed_yahoo_dbc_dblci_total_return_etf
sources:
  - name: Trading_Commo daily GSCI workbook
    role: active_daily_gsci_er_and_tr
    url: https://raw.githubusercontent.com/yessinemx/Trading_Commo/f5ecf1507fb9cc98ffcc1f69c217793f5f9272a3/data/GSCI_Data.xlsx
    commit: f5ecf1507fb9cc98ffcc1f69c217793f5f9272a3
    raw_file: sources/raw/broad_commodities_gsci_daily.xlsx
    sha256: 918e4046300180e0274781bfa6f1f5dcf2dc7df61b9229f9d4a9ea124da2a9f8
    bytes: 442834
    accessed: 2026-09-30
    sheet: Données GSCI
    observed_first_date: 1970-01-02
    observed_last_date: 2025-12-31
    observed_rows: 14609
    provenance: author_claimed_bloomberg_px_last_terminal_extraction_not_authenticated
    weekday_fill: NON_TRADING_WEEKDAYS_PREVIOUS_VALUE
    launch_date: 1991-05-01
    redistribution: no_verified_vendor_or_derived_output_grant
  - name: Versioned processed baseline
    role: preserved_bcom_irx_dbc_return_ratios_during_migration
    git_commit: 20396a64b4203cb9d06b4d096e473f268a57684b
    git_blob: d0b200724beeb67ad6e0504df71da447f01399f0
    csv_sha256: d31df07d79f778ce48069c383342e2784d837c4d3dfbd58da921b4685f8856d7
    first_date: 1970-01-02
    last_date: 2026-09-28
    notes: Historical Yahoo caches absent; later ratios preserved, not freshly vendor-validated.
  - name: Yahoo BCOM chart
    role: raw_source_full_build_bcom_excess_return
    url: https://query1.finance.yahoo.com/v8/finance/chart/%5EBCOM
    raw_file: sources/raw/broad_commodities_yahoo_bcom_chart.json
    availability: unavailable_404_in_september_2026_cache_required
  - name: Yahoo IRX chart
    role: raw_source_full_build_bcom_collateral_only
    url: https://query1.finance.yahoo.com/v8/finance/chart/%5EIRX
    raw_file: sources/raw/broad_commodities_yahoo_irx_chart.json
    notes: Forward-filled rate; IRX_percent / 100 / 365 per observation, not per elapsed calendar day.
  - name: Yahoo DBC chart
    role: observed_etf_returns_and_active_incremental_tail
    url: https://query1.finance.yahoo.com/v8/finance/chart/DBC
    notes: ETF net return, Yahoo-adjusted close, fund expenses and distributions.
superseded_sources:
  - name: MacroMicro sparse GSCI TR anchor
    status: superseded_by_direct_daily_gsci
    url: https://en.macromicro.me/series/2692/sp-gsci-index
  - name: Yahoo SPGSCI spot-shape overlay
    status: superseded_by_direct_daily_gsci
    url: https://query1.finance.yahoo.com/v8/finance/chart/%5ESPGSCI
  - name: World Bank monthly spot model
    status: superseded_in_june_2026
data_gaps:
  - id: redistribution_rights_unverified
    severity: high
    description: Public source availability and code licensing do not establish vendor or derived-publication rights.
  - id: back_calculation_and_weekday_fill
    severity: medium
    description: Entire imported GSCI segment precedes publication; weekday holidays may carry prior levels.
  - id: extraction_not_authenticated
    severity: medium
    description: Companion code and corroboration support identity; original Bloomberg extraction is unverified.
  - id: gsci_not_dbc_weighting
    severity: medium
    description: GSCI production weights and roll rules differ from DBC.
  - id: bcom_index_type_and_collateral_model
    severity: medium
    description: ER identity inferred from behavior; IRX per-observation accrual is an approximation.
  - id: dbc_fund_net_return
    severity: medium
    description: Fund expenses, distributions and Yahoo adjustment behavior differ from gross index return.
  - id: chain_methodology_breaks
    severity: high
    description: GSCI to BCOM in 1991 and BCOM to DBC in 2006 change economic exposure.
  - id: blank_ohlcv
    severity: low
    description: Open, High, Low and Volume are blank throughout the synthetic growth series.
milestones:
  - id: cmdty-011
    name: Sparse GSCI total-return anchor reconstruction
    status: superseded_by_daily_gsci
  - id: cmdty-012
    name: Acquire, corroborate and independently review daily 1970s GSCI ER/TR
    status: complete
    research: docs/research/cmdty_daily_1970s_followup.md
    review: docs/research/cmdty_full_history_astra_review.md
  - id: cmdty-013
    name: Implement daily GSCI replacement and preserve later returns
    status: complete
    notes: >
      5255 early rows replaced; 8973 later return pairs and all 14228 dates retained.
      ER and TR normalized and spliced independently. Versioned baseline preserved.
  - id: cmdty-014
    name: Resolve vendor and derived-publication rights
    status: unresolved
validation:
  required_checks:
    - pinned_workbook_identity_hash_schema_and_complete_weekday_coverage
    - preserved_calendar_hash_and_selected_level_ratios
    - all_5255_paired_er_tr_imports_match_source
    - all_22_annual_and_22_sec_level_reference_gates
    - positive_levels_and_return_arithmetic
    - back_calculation_launch_date_and_fill_labels
    - separate_er_tr_splices_and_later_ratio_preservation
    - csv_parquet_and_metadata_consistency
    - incremental_gsci_prefix_preservation_and_metadata_maintenance
    - invalid_input_concurrent_update_and_output_failure_safeguards
automated_publication:
  mode: incremental_from_committed_processed_csv
  historical_raw_required: false
  recent_source_validation: scripts/check_daily_diff.py
  overlap_calendar_days: 14
  new_source_rights: unresolved_before_external_redistribution
