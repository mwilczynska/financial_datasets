asset_id: long_term_us_treasury
asset_name: Long-Term U.S. Treasury / TLT-like Total Return
backtest_alias: LTT
minimum_start_date: 1970-01-01
target_frequency: daily
output_contract: yahoo_compatible_ohlcv_plus_returns
status: complete_model_derived
current_dataset_status: fed_yield_curve_model_from_1970_plus_public_fund_returns_from_1986
target_definition: TLT-like U.S. Treasury exposure, approximately 20+ year remaining maturity, total return with coupons/distributions reinvested.
milestones:
  - id: ltt-001
    name: Define TLT-like asset contract
    status: complete
  - id: ltt-002
    name: Search and classify sources
    status: in_progress
  - id: ltt-003
    name: Implement provisional public fund-backed dataset
    status: complete
  - id: ltt-004
    name: Build 1970+ daily Treasury return history
    status: complete
  - id: ltt-005
    name: Add validation fixtures and tests
    status: complete
  - id: ltt-006
    name: Document methodology and caveats
    status: complete
sources:
  - name: CRSP US Treasury Database
    role: preferred_future_constituent_level_upgrade_source
    status: candidate_upgrade
    url: https://www.crsp.org/
    notes: Daily Treasury issue prices/returns since 1961 are the preferred source for a true daily 1970+ 20+ year Treasury total-return index with coupon payments.
  - name: iShares TLT
    role: target_definition_and_post_2002_public_return_source
    status: active_from_2002
    url: https://www.ishares.com/us/products/239454/ishares-20-year-treasury-bond-etf
    notes: TLT tracks the ICE US Treasury 20+ Year Bond Index and targets U.S. Treasury bonds with remaining maturities greater than 20 years.
  - name: Yahoo Finance chart API TLT
    role: daily_tlt_adjusted_return_source
    status: active_from_2002
    url: https://query1.finance.yahoo.com/v8/finance/chart/TLT
    notes: Used for public daily TLT close and adjusted-close returns after TLT has return history.
  - name: Yahoo Finance chart API VUSTX
    role: pre_tlt_public_long_treasury_fund_proxy
    status: active_from_1986
    url: https://query1.finance.yahoo.com/v8/finance/chart/VUSTX
    notes: Used as a public long-term Treasury mutual fund adjusted-return proxy before TLT has daily return history.
  - name: FRED DGS30
    role: candidate_model_input_1977_1986
    status: candidate_not_sufficient_alone
    url: https://fred.stlouisfed.org/series/DGS30
    notes: Daily 30-year Treasury constant maturity yield. Useful for a model-derived par-bond extension, but not a constituent-level total-return source by itself.
  - name: Federal Reserve Nominal Yield Curve
    role: primary_1970_1986_model_input
    status: active
    url: https://www.federalreserve.gov/data/nominal-yield-curve.htm
    notes: Daily estimated nominal yield curve parameters and smoothed yields from 1961 to present. Used to model 25-year constant-maturity par Treasury price and coupon-carry total returns before VUSTX begins.
validation:
  required_independent_sources: 1
  coverage_anchor_date: 1970-01-01
  current_first_observation: 1970-01-02
  required_checks:
    - yahoo_schema
    - duplicate_dates
    - positive_levels
    - return_arithmetic
    - source_segment_daily_return_match
    - tlt_overlap_validation
